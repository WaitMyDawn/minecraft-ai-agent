spring.application.name=Minecraft-AI-Agent

ai.api.key=${DEEPSEEK_API_KEY:}
ai.api.url=https://api.deepseek.com/v1

maa.encryption.secret=${MAA_ENCRYPTION_SECRET:}

maa.allow-registration=${MAA_ALLOW_REGISTRATION:false}

spring.datasource.url=jdbc:h2:file:./maa_db/knowledge;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.threads.virtual.enabled=true

maa.loader-versions.path=maa_db/loader-versions.json
maa.rules.path=maa_db/rules.json
maa.aliases.path=maa_db/aliases.json

# 本地版本预过滤（P4-D）：用建库时落库的 game_versions 先否掉"确定不支持目标 MC 版本"的候选，
# 从而省掉对应的 Modrinth 请求。只做否定、失败时不过滤；若观察到误杀可置为 false 立即关闭。
maa.cache.game-version-prefilter=true


curseforge.api.key=${CURSEFORGE_API_KEY:}

spring.task.scheduling.pool.size=2

# ---- Modrinth 全局出网令牌闸 ----
# 实测限额为 300 次/分钟/出口 IP。默认放 240，留 20% 余量给退避窗口与后续新增路径；
# 多实例部署时每个实例各有一把闸，出口 IP 却是共享的——那种情况下要么调低这个值，
# 要么把闸改成共享实现（当前代码按单实例假设）。
# burst：允许的瞬时突发额度。稳态速率仍是 rate-per-minute，但冷启动时不必逐个等间隔，
#        否则 99 个候选要排队 25 秒，比"并发冲一把再退避"还慢。
# max-wait-ms：单个请求最长排队时间，超了直接放弃并按"无法确定"处理，
#        避免把 HTTP 请求无限期挂死。
maa.modrinth.rate-per-minute=${MAA_MODRINTH_RATE_PER_MINUTE:240}
maa.modrinth.burst=${MAA_MODRINTH_BURST:40}
maa.modrinth.max-wait-ms=${MAA_MODRINTH_MAX_WAIT_MS:30000}

# 批量端点预取（一次请求取 100 个模组的元数据）。怀疑批量端点上出问题时可置 false，
# 立刻退回"每个模组一条请求"的旧行为——不需要改代码、不需要回滚版本。
maa.modrinth.batch-prefetch=${MAA_MODRINTH_BATCH_PREFETCH:true}

# ---- 把 Modrinth 取数委派给用户浏览器 ----
# 打开后：服务器不再自己发请求，而是把"要哪些事实"下发给前端，由用户的浏览器直连 Modrinth
# 取回（用户的出口 IP 各自独立，配额随用户数增长，服务器侧归零）。
# 关掉时后端走原来的同步路径，前端行为零变化——等价于没做这个功能。
# 默认 false：先把后端与取数器都验证过再打开。
maa.delegation.enabled=${MAA_DELEGATION_ENABLED:false}

# 单次委派的等待预算：浏览器在这段时间内没把结果送回来，这一次就退回服务器自己抓。
# 给成 0 会让每次委派都立刻超时（退化成"服务器全包"），所以代码里有 50ms 下限。
maa.delegation.per-call-budget-ms=${MAA_DELEGATION_PER_CALL_BUDGET_MS:5000}
