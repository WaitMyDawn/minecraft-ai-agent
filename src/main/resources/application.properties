spring.application.name=Minecraft-AI-Agent

ai.api.key=${DEEPSEEK_API_KEY:}
ai.api.url=https://api.deepseek.com/v1

maa.encryption.secret=${MAA_ENCRYPTION_SECRET:}

maa.allow-registration=${MAA_ALLOW_REGISTRATION:false}

# 登录 token 的空闲有效期（天）。滑动续期：每次有效使用都顺延，只要还在用就不会被踢下线。
# 配小（如 1）能更快收口泄漏出去的 token，代价是"用户隔几天回来要重新登录"。
maa.session.ttl-days=${MAA_SESSION_TTL_DAYS:30}

# ===== 邮件（验证码）=====
# 总开关。false 时注册/找回密码这些入口会明确回"邮件服务未配置"，而不是抛 500。
maa.mail.enabled=${MAA_MAIL_ENABLED:false}
# 生效通道：resend（默认，HTTP API、域名验证后免逐个验证发件人）
#          brevo（HTTP API、额度可查，但注册要过手机核验）
#          smtp（阿里云 DirectMail / QQ / 163）
# 想切回阿里云不用改代码：MAA_MAIL_PROVIDER=smtp + docker compose up -d
maa.mail.provider=${MAA_MAIL_PROVIDER:resend}
# 发件人地址必须与 SMTP 账号在同一个已验证域名下（阿里云 DirectMail 的规则），否则会被拒信
maa.mail.from=${MAA_MAIL_FROM:}
# 收件人看到的发件人名字
maa.mail.from-name=${MAA_MAIL_FROM_NAME:MAA}

# ===== Resend（当前生效通道）=====
# 控制台 → API Keys 创建，形如 re_...（建议把权限限制成 "Sending access" 并锁定到 send 子域）
maa.mail.resend.api-key=${MAA_RESEND_API_KEY:}
# 必须是已验证域名下的地址：noreply@send.minecraft-ai-agent.com
maa.mail.resend.from=${MAA_RESEND_FROM:}
maa.mail.resend.from-name=${MAA_RESEND_FROM_NAME:MAA}
# 验收专用：开成 true 后每次发信都直接按"额度用完"失败（不真发信、不烧额度）。
# 用来验证"额度用完时用户看到什么"。生产必须保持 false。
maa.mail.simulate-quota=${MAA_MAIL_SIMULATE_QUOTA:false}

# ===== Brevo（备用通道）=====
# 控制台 → SMTP & API → API Keys 里生成，形如 xkeysib-...
maa.mail.brevo.api-key=${MAA_BREVO_API_KEY:}
# 发件人：Brevo 允许"只验证一个发件人邮箱"就发给任意收件人（不必先配域名 DNS）
maa.mail.brevo.from=${MAA_BREVO_FROM:}
maa.mail.brevo.from-name=${MAA_BREVO_FROM_NAME:MAA}
# 额度查询结果的缓存时长：每次发信都问一次 Brevo 太浪费，5 分钟足够
maa.mail.brevo.quota-cache-ms=${MAA_BREVO_QUOTA_CACHE_MS:300000}

# SMTP。云厂商默认封 25 端口，用 465(SSL) 或 587(STARTTLS)。
# 阿里云 DirectMail：host=smtpdm.aliyun.com（新加坡区是 smtpdm-ap-southeast-1.aliyun.com）
# QQ/163 个人邮箱：smtp.qq.com / smtp.163.com，密码填"授权码"而不是邮箱登录密码
spring.mail.host=${MAA_MAIL_HOST:}
spring.mail.port=${MAA_MAIL_PORT:465}
spring.mail.username=${MAA_MAIL_USERNAME:}
spring.mail.password=${MAA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
# 三个超时都必须给：SMTP 抖动时不能让用户的注册请求一直挂着
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== 验证码限流（一个邮箱一天最多 3 个码，注册/改密码/换绑共用这个额度）=====
maa.email-code.max-per-day=${MAA_EMAIL_CODE_MAX_PER_DAY:3}
maa.email-code.cooldown-ms=${MAA_EMAIL_CODE_COOLDOWN_MS:60000}

# 运维端点（目前只有 POST /api/ops/backup 在线备份）。token 为空 = 端点当作不存在（404），
# 默认就是关闭的；要在服务器上跑 ops/backup.sh 才需要设它（同步写进 /opt/maa/.env）。
maa.ops.token=${MAA_OPS_TOKEN:}
# 备份落盘位置。默认在 maa_db 下 —— 这个目录是卷挂载的，所以备份直接出现在宿主机上，方便 scp 取走。
maa.ops.backup-dir=${MAA_OPS_BACKUP_DIR:maa_db/backups}

spring.datasource.url=jdbc:h2:file:./maa_db/knowledge;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 数据库健康探针的缓存时长：/api/health 每被调一次就查库的话，健康检查（30 秒一次）会变成
# 数据库的常态化固定负载。缓存 60 秒 ⇒ 稳态每分钟一次。
maa.db.health.ttl-ms=${MAA_DB_HEALTH_TTL_MS:60000}

spring.threads.virtual.enabled=true

# 停服时先停止接收新请求，把手上的请求跑完再退出（docker compose restart 时用户不会撞到半截的 502）。
# 上限 25 秒：几分钟的长轮构筑等不完，到点还是会断——这里是"少切一刀"，不是"保证不切"。
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

maa.loader-versions.path=maa_db/loader-versions.json
maa.rules.path=maa_db/rules.json
maa.aliases.path=maa_db/aliases.json

maa.cache.game-version-prefilter=true


curseforge.api.key=${CURSEFORGE_API_KEY:}

spring.task.scheduling.pool.size=2

maa.modrinth.rate-per-minute=${MAA_MODRINTH_RATE_PER_MINUTE:240}
maa.modrinth.burst=${MAA_MODRINTH_BURST:40}
maa.modrinth.max-wait-ms=${MAA_MODRINTH_MAX_WAIT_MS:30000}

maa.modrinth.batch-prefetch=${MAA_MODRINTH_BATCH_PREFETCH:true}

maa.delegation.enabled=${MAA_DELEGATION_ENABLED:true}

# 这是"最多等多久"，不是"固定等多久"——客户端按时答完，等待立刻结束，与这个值无关。
#
# 为什么给到 30 秒：同一批 46~48 个 env_version，两次实测分别是 2.8 秒和 10.3 秒（波动 3.6 倍）。
# 预算给 10 秒时，后者会让 46 个请求全部回落到服务器自己抓——而服务器兜底并不便宜：
# 它要过全局令牌闸（240/分钟），突发额度用光后按 4 次/秒排队，量大时比等客户端还慢。
# 服务器侧令牌闸的 max-wait-ms 也是 30 秒，两边口径一致。
maa.delegation.per-call-budget-ms=${MAA_DELEGATION_PER_CALL_BUDGET_MS:30000}
