spring.application.name=Minecraft-AI-Agent

ai.api.key=${DEEPSEEK_API_KEY:}
ai.api.url=https://api.deepseek.com/v1

maa.encryption.secret=${MAA_ENCRYPTION_SECRET:}

maa.allow-registration=${MAA_ALLOW_REGISTRATION:false}

spring.datasource.url=jdbc:h2:file:./maa_db/knowledge;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.threads.virtual.enabled=true

maa.loader-versions.path=maa_db/loader-versions.json
maa.rules.path=maa_db/rules.json
maa.aliases.path=maa_db/aliases.json

maa.cache.game-version-prefilter=true


curseforge.api.key=${CURSEFORGE_API_KEY:}

spring.task.scheduling.pool.size=2

maa.modrinth.rate-per-minute=${MAA_MODRINTH_RATE_PER_MINUTE:240}
maa.modrinth.burst=${MAA_MODRINTH_BURST:40}
maa.modrinth.max-wait-ms=${MAA_MODRINTH_MAX_WAIT_MS:30000}

maa.modrinth.batch-prefetch=${MAA_MODRINTH_BATCH_PREFETCH:true}

maa.delegation.enabled=${MAA_DELEGATION_ENABLED:true}

# 这是"最多等多久"，不是"固定等多久"——客户端按时答完，等待立刻结束，与这个值无关。
#
# 为什么给到 30 秒：同一批 46~48 个 env_version，两次实测分别是 2.8 秒和 10.3 秒（波动 3.6 倍）。
# 预算给 10 秒时，后者会让 46 个请求全部回落到服务器自己抓——而服务器兜底并不便宜：
# 它要过全局令牌闸（240/分钟），突发额度用光后按 4 次/秒排队，量大时比等客户端还慢。
# 服务器侧令牌闸的 max-wait-ms 也是 30 秒，两边口径一致。
maa.delegation.per-call-budget-ms=${MAA_DELEGATION_PER_CALL_BUDGET_MS:30000}
